async function hydrateThumbs(root,admin=false){
 if(!root)return;
 const imgs=[...root.querySelectorAll('img[data-photo-id]')];
 const missing=[];
 for(const im of imgs){
   const id=im.dataset.photoId,found=thumbCache.get(id);
   if(im.dataset.errorBound!=='1'){
     im.dataset.errorBound='1';
     im.addEventListener('error',()=>{
       if(im.src===THUMB_PLACEHOLDER)return;
       im.src=THUMB_PLACEHOLDER;im.classList.remove('loaded');im.classList.add('thumbUnavailable');
       im.title='圖片格式無法在這台裝置顯示，可至後台檢查圖檔格式';
       const note=$('#photoErrorNote');if(note)note.hidden=false;
     });
   }
   if(found){im.src=found;im.classList.add('loaded');}
   else if(!missing.includes(id))missing.push(id);
 }
 for(let i=0;i<missing.length;i+=3){
   const batch=missing.slice(i,i+3);
   try{
     const r=await rpc('thumbnails',{ids:batch,...(admin?{token:state.token}:{})});
     for(const id of batch){
       const url=r.images?.[id]; if(url)thumbCache.set(id,url);
       for(const im of imgs.filter(el=>el.dataset.photoId===id&&el.isConnected)){
         im.src=url||THUMB_PLACEHOLDER;
         im.classList.toggle('loaded',!!url);
         if(!url){im.title=r.failures?.[id]||'照片正在處理，請稍後重新整理';im.classList.add('thumbUnavailable');imageFailures++;const note=$('#photoErrorNote');if(note){note.hidden=false;note.title=im.title;}}
       }
     }
   }catch(e){console.warn('縮圖載入中斷',e.message);const note=$('#photoErrorNote');if(note){note.hidden=false;note.title=e.message;}}
 }
}

 const p=state.items.find(x=>x.id===id);if(!p)return;
 const found=state.cart.find(x=>x.id===id),current=found?.qty||0;
 if(current>=20)return notify('同一商品每筆最多20件',true);

 if(state.cart.some(x=>x.id!==id&&(x.payMode||'CONFIRM')!==(p.payMode||'CONFIRM')))return notify('立即付款商品與待確認商品請分開結帳，先完成目前購物車',true);
 if(found)found.qty++;else state.cart.push({id:p.id,price:p.price,qty:1,payMode:p.payMode||'CONFIRM'});
 updateCart();notify('已加入購物車');

function changeQty(id,d){
 const p=state.cart.find(x=>x.id===id);if(!p)return;
 const current=state.items.find(x=>x.id===id),max=current&&current.available!==null?Math.min(20,current.available):20;
 if(d>0&&p.qty>=max)return notify('目前商品剩餘數量不足',true);
 p.qty+=d;if(p.qty<=0)state.cart=state.cart.filter(x=>x!==p);else p.qty=Math.min(max,p.qty);
 updateCart();render();
}

function webConfirm({title,details='',notice='',okText='確認',cancelText='返回修改'}){
 return new Promise(resolve=>{
  const previous=document.activeElement;
  const overlay=document.createElement('div');overlay.className='checkoutDialogOverlay';overlay.id='webCheckoutDialog';
  overlay.innerHTML=`<section class="checkoutDialogCard" role="dialog" aria-modal="true" aria-labelledby="checkoutDialogTitle"><h2 id="checkoutDialogTitle">${H(title)}</h2>${details?`<div class="checkoutDialogDetails">${details}</div>`:''}${notice?`<div class="checkoutDialogAlert">${H(notice)}</div>`:''}<div class="checkoutDialogActions"><button type="button" id="checkoutDialogCancel">${H(cancelText)}</button><button class="primary" type="button" id="checkoutDialogOK">${H(okText)}</button></div></section>`;
  const yes=overlay.querySelector('#checkoutDialogOK'),no=overlay.querySelector('#checkoutDialogCancel');
  const done=answer=>{document.removeEventListener('keydown',onKey,true);overlay.remove();try{previous?.focus({preventScroll:true});}catch(e){}resolve(answer);};
  const onKey=e=>{
   if(e.key==='Escape'){e.preventDefault();done(false);return;}
   if(e.key==='Tab'){
    const first=no,last=yes;
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
   }
  };
  document.body.appendChild(overlay);no.onclick=()=>done(false);yes.onclick=()=>done(true);
  document.addEventListener('keydown',onKey,true);
  no.focus({preventScroll:true});
 });
}

function normalizePhoneUi(phone){

 else if(/^9\d{8}$/.test(s))s='0'+s;
 return s;
}

async function doOrderAction(id,act){const msg={available:'確認現場可買到？按下後客人有60分鐘轉帳台幣商品全額。',paid:'確認銀行已收到換算後的台幣商品全額？',bought:'確認你已在日本成功購得商品？',unavailable:'確定無法購買？若已收款需另行退款。',shipped:'確認商品全額已收且國際運費已另行處理，再出貨？'}[act];if(msg&&!confirm(msg))return;
 let freightJpy,tracking,phone,lineId;
 if(act==='updateCustomer'){
   phone=prompt('請輸入客人正確手機號碼（0912345678）');if(phone===null)return;
   lineId=prompt('請輸入客人下單用的 LINE ID');if(lineId===null)return;
   if(!confirm('確定要更新此訂單的手機號碼和 LINE ID？請先和客人核對資料。'))return;
 }
 if(act==='freight'){
  const o=(state.adminOrders||[]).find(x=>String(x.id)===String(id));
  if(!o)return notify('找不到訂單，請重新整理',true);
  const rate=o.salesChannel==='wanye'?0.25:0.27;
  const original=o.freightJpy!==null?String(o.freightJpy):'';
  const input=prompt('請輸入運費日幣整數（0 代表免運）\n'+(o.shopLabel||'頑夜')+'匯率 ×'+rate.toFixed(2)+'\n系統自動換算台幣；舊版台幣報價不會自動反推日幣。',original);
  if(input===null)return;
  if(!/^\d+$/.test(input.trim())||!Number.isSafeInteger(Number(input))||Number(input)>10000000)return notify('請輸入 0～10,000,000 的日幣整數',true);
  freightJpy=Number(input.trim());
  const amount=Math.round(freightJpy*rate);
  if(!confirm('確認運費報價？\n日幣：'+yen(freightJpy)+'\n'+rate.toFixed(2)+' 換算台幣：'+money(amount)+'\n'+(o.shipmentGroupId?'合併配送僅由主訂單報價':'') ))return;
 }
 if(act==='shipped'){tracking=prompt('寄件單號或取件說明（可留空）');if(tracking===null)return;}
 try{await rpc('orderAction',{token:state.token,id,act,freightJpy,tracking,phone,lineId});notify('訂單資料已更新');adminOrders();}catch(e){notify(e.message,true);}}

let vendorSettleSnapshot=null;
let vendorActiveTab='pending';
let vendorCurrentPreset='all';
let vendorSettlementBusy=false;
const vendorMoney=n=>'NT$'+Number(n||0).toLocaleString('zh-TW');
const vendorSum=(items,k)=>items.reduce((sum,o)=>sum+Number(o[k]||0),0);
function vendorPeriodTime(d,end){
 if(!d)return end?Infinity:-Infinity;
 const a=new Date(d+'T00:00:00');
 if(!Number.isFinite(+a))return end?Infinity:-Infinity;
 if(end)a.setDate(a.getDate()+1);
 return +a;
}
function vendorDateInput(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function vendorPeriodItems(){
 if(!vendorSettleSnapshot)return [];
 const from=vendorPeriodTime($('#vendorStart')?.value,false),to=vendorPeriodTime($('#vendorEnd')?.value,true);
 return (vendorSettleSnapshot.entries||[]).filter(o=>o.createdAt>=from&&o.createdAt<to);
}
function vendorKind(o){if(o.refundAlert)return 'alert';if(o.settled)return 'settled';return o.eligible?'pending':'review';}
function vendorTabItems(os){
 const query=($('#vendorSearch')?.value||'').trim().toLocaleLowerCase();
 return os.filter(o=> (vendorActiveTab==='all'||vendorKind(o)===vendorActiveTab||(vendorActiveTab==='settled'&&o.settled)) && (!query || String(o.id||'').toLocaleLowerCase().includes(query)||String(o.customerName||'').toLocaleLowerCase().includes(query)||String(o.batchId||'').toLocaleLowerCase().includes(query)));
}
function vendorClearChosen(){document.querySelectorAll('.vendorPick:checked').forEach(x=>x.checked=false);updateVendorPicked();}
function vendorSetTab(v){vendorActiveTab=v;renderVendorSettlementList();}
function vendorPreset(v){
 const a=$('#vendorStart'),b=$('#vendorEnd');if(!a||!b)return;
 const now=new Date(),year=now.getFullYear(),month=now.getMonth();
 let start=null,end=null;
 if(v==='current'){const m=now.getDate()>=20?month:month-1;start=new Date(year,m,20);end=new Date(year,m+1,19);}
 if(v==='previous'){const m=now.getDate()>=20?month-1:month-2;start=new Date(year,m,20);end=new Date(year,m+1,19);}
 if(v==='month'){start=new Date(year,month,1);end=new Date(year,month+1,0);}
 if(v==='30'){start=new Date(year,month,now.getDate()-29);end=now;}
 a.value=start?vendorDateInput(start):'';b.value=end?vendorDateInput(end):'';
 vendorCurrentPreset=v;renderVendorSettlementList();
}
function vendorManualPeriod(){vendorCurrentPreset='custom';renderVendorSettlementList();}

    <label class="vendorOrderTick" title="${pickable?'勾選結算':'此訂單不可結算'}">${pickable?`<input type="checkbox" class="vendorPick" value="${H(o.id)}" aria-label="勾選訂單 ${H(o.id)} 結算" onchange="vendorPickChanged()">`:'<span aria-hidden="true">—</span>'}</label>
    <div class="vendorOrderInfo"><strong>${H(o.id)}</strong><small>${date(o.createdAt)} · ${H(o.customerName||'未填客戶')}</small><span class="vendorStatus ${kind==='settled'?'paid':kind}">${statusText[kind]}</span><small>${H(statusName[o.status]||o.status)}${o.settled?' · 批次 '+H(o.batchId):''}</small></div>
    <div class="vendorMoneyColumns"><div><small>商品日幣</small><b>${yen(o.totalJpy)}</b></div><div><small>客付商品款</small><b>${vendorMoney(o.amountTwd)}</b></div></div>
    <div class="vendorCommission"><small>廠商分潤 ×0.03</small><strong>${vendorMoney(o.commissionTwd)}</strong>${o.settled?`<small>結算 ${date(o.settledAt)}</small>`:''}</div>
    ${kind==='alert'?'<div class="vendorRefundMini">此筆已付款給廠商，訂單後續退款／取消，請人工核對扣回。</div>':''}
   </div>`;
 }).join('')||'<div class="vendorEmpty">這個篩選條件沒有訂單。<br>可以切換上方狀態或點「全部日期」查看。</div>';
 updateVendorPicked();
}

async function confirmVendorSettlementNow(){
 if(vendorSettlementBusy)return;
 const records=vendorSelectedRecords(),ids=records.map(o=>o.id);
 if(!ids.length)return notify('請先勾選可結算的訂單',true);
 if(ids.length>100)return notify('每批最多結算 100 筆',true);
 const amount=vendorSum(records,'commissionTwd'),note=($('#vendorSettlementNote')?.value||'').trim();
 if(!confirm(`請確認「已實際匯款」給瘋Toys：\n\n訂單 ${ids.length} 筆\n廠商應得 ${vendorMoney(amount)}\n\n確認後會留下結算紀錄，且不能重複結算。`))return;
 vendorSettlementBusy=true;updateVendorPicked();
 try{
  const r=await rpc('confirmVendorSettlement',{token:state.token,ids,note});
  notify(`已記錄結算 ${r.count} 筆，${vendorMoney(r.commissionTwd)} · ${r.batchId}`);
  await adminVendorSettlement();
 }catch(e){notify(e.message,true);vendorSettlementBusy=false;updateVendorPicked();}
}
function exportVendorSettlementCsv(){
 if(!vendorSettleSnapshot)return notify('請重新載入廠商結單資料',true);
 const os=vendorTabItems(vendorPeriodItems()),head=['訂單編號','下單日期','付款日期','訂單狀態','客戶','商品日幣總額','商品款台幣','廠商分潤台幣','頑夜留存台幣(未扣採購成本)','結算狀態','結單批次','結單日期','備註','退款扣回警示'];
 const cell=x=>'"'+String(x===undefined||x===null?'':x).replace(/^[\s]*[=+\-@]/,"'").replace(/"/g,'""')+'"';
 const lines=[head,...os.map(o=>[o.id,new Date(o.createdAt).toLocaleDateString('zh-TW'),o.paidAt?new Date(o.paidAt).toLocaleDateString('zh-TW'):'',statusName[o.status]||o.status,o.customerName,o.totalJpy,o.amountTwd,o.commissionTwd,o.retainedTwd,o.settled?'已結':'未結',o.batchId,o.settledAt?new Date(o.settledAt).toLocaleString('zh-TW'):'',o.note,o.refundAlert?'需要人工扣回':''])];
 const csv='\uFEFF'+lines.map(row=>row.map(cell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
 a.href=url;a.download='瘋Toys_結單_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
}

async function exportCsv(type){try{const d=await rpc('export',{token:state.token,type});function cv(v){let s=String(v===null||v===undefined?'':v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
 const csv='\uFEFF'+[d.headers,...d.rows].map(r=>r.map(cv).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='頑夜日本連線_'+type+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
 }catch(e){notify(e.message,true);}}
